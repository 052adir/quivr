<title>מערכת ניהול פרגו</title>
<style>
  :root{
    --bg:#e9edf0; --surface:#ffffff; --surface-2:#f3f6f8; --border:#dbe2e7;
    --ink:#16232c; --dim:#586873; --mute:#8f9ea8;
    --accent:#0e7c8a; --accent-soft:#dcf0f2; --accent-ink:#0a5b66;
    --good:#12915a; --good-soft:#e3f4ea; --warn:#c9760c; --warn-soft:#fbeed7;
    --bad:#d0453f; --bad-soft:#fbe6e5;
    --shadow:0 1px 2px rgba(16,35,44,.06); --shadow-lg:0 10px 34px rgba(16,35,44,.10);
    --r:15px;
    --font:system-ui,-apple-system,"Segoe UI","Noto Sans Hebrew","Arial Hebrew",Arial,sans-serif;
  }
  @media (prefers-color-scheme:dark){
    :root{
      --bg:#0c1317; --surface:#141f27; --surface-2:#1b2831; --border:#25343d;
      --ink:#e7eef2; --dim:#93a6b1; --mute:#5f717c;
      --accent:#2fb4c5; --accent-soft:#0f2f37; --accent-ink:#7fd9e4;
      --good:#3bb277; --good-soft:#10281e; --warn:#e0952f; --warn-soft:#2c2110;
      --bad:#e26a63; --bad-soft:#2c1615;
      --shadow:0 1px 2px rgba(0,0,0,.3); --shadow-lg:0 12px 36px rgba(0,0,0,.5);
    }
  }
  :root[data-theme="light"]{
    --bg:#e9edf0; --surface:#ffffff; --surface-2:#f3f6f8; --border:#dbe2e7;
    --ink:#16232c; --dim:#586873; --mute:#8f9ea8;
    --accent:#0e7c8a; --accent-soft:#dcf0f2; --accent-ink:#0a5b66;
    --good:#12915a; --good-soft:#e3f4ea; --warn:#c9760c; --warn-soft:#fbeed7;
    --bad:#d0453f; --bad-soft:#fbe6e5; --shadow:0 1px 2px rgba(16,35,44,.06); --shadow-lg:0 10px 34px rgba(16,35,44,.10);
  }
  :root[data-theme="dark"]{
    --bg:#0c1317; --surface:#141f27; --surface-2:#1b2831; --border:#25343d;
    --ink:#e7eef2; --dim:#93a6b1; --mute:#5f717c;
    --accent:#2fb4c5; --accent-soft:#0f2f37; --accent-ink:#7fd9e4;
    --good:#3bb277; --good-soft:#10281e; --warn:#e0952f; --warn-soft:#2c2110;
    --bad:#e26a63; --bad-soft:#2c1615; --shadow:0 1px 2px rgba(0,0,0,.3); --shadow-lg:0 12px 36px rgba(0,0,0,.5);
  }

  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);-webkit-font-smoothing:antialiased;line-height:1.5}
  #app{direction:rtl}
  h1,h2,h3{margin:0;text-wrap:balance}
  button{font-family:inherit}
  .tnum{font-variant-numeric:tabular-nums}

  /* layout */
  .shell{display:grid;grid-template-columns:1fr;min-height:100dvh}
  @media(min-width:900px){.shell{grid-template-columns:248px 1fr}}
  .side{display:none}
  @media(min-width:900px){
    .side{display:flex;flex-direction:column;gap:6px;padding:18px 14px;border-inline-end:1px solid var(--border);
      background:var(--surface);position:sticky;top:0;height:100dvh}
  }
  .brand{display:flex;align-items:center;gap:11px;padding:4px 6px 16px}
  .logo{width:42px;height:42px;border-radius:12px;display:grid;place-items:center;font-weight:800;color:#fff;font-size:20px;
    background:linear-gradient(140deg,var(--accent),var(--accent-ink));flex:0 0 auto}
  .brand b{font-size:1.02rem;font-weight:800;display:block;letter-spacing:-.01em}
  .brand span{font-size:.74rem;color:var(--dim)}
  .navitem{display:flex;align-items:center;gap:11px;padding:10px 12px;border-radius:11px;color:var(--dim);
    font-weight:600;font-size:.92rem;cursor:pointer;border:none;background:none;text-align:start;width:100%}
  .navitem:hover{background:var(--surface-2);color:var(--ink)}
  .navitem.on{background:var(--accent);color:#fff}
  .navitem.on svg{stroke:#fff}
  .navitem svg{width:19px;height:19px;stroke:var(--dim);flex:0 0 auto}
  .navitem:hover svg{stroke:var(--ink)}

  .main{min-width:0;display:flex;flex-direction:column}
  .head{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:12px;padding:13px 16px;
    background:color-mix(in srgb,var(--surface) 86%,transparent);backdrop-filter:blur(9px);border-bottom:1px solid var(--border)}
  .head .mtitle{font-size:1.15rem;font-weight:800}
  .head .mbrand{display:flex;align-items:center;gap:9px}
  @media(min-width:900px){.head .mbrand{display:none}}
  .mlogo{width:30px;height:30px;border-radius:9px;display:grid;place-items:center;font-weight:800;color:#fff;font-size:15px;
    background:linear-gradient(140deg,var(--accent),var(--accent-ink))}
  .today{margin-inline-start:auto;text-align:end;line-height:1.25}
  .today b{font-size:.82rem;font-weight:700}
  .today span{display:block;font-size:.72rem;color:var(--dim)}
  .modechip{font-size:.68rem;font-weight:700;padding:4px 9px;border-radius:99px;background:var(--surface-2);color:var(--dim);
    border:1px solid var(--border);white-space:nowrap}

  .wrap{padding:16px;max-width:1140px;width:100%;margin:0 auto;padding-bottom:96px}
  @media(min-width:900px){.wrap{padding:22px 26px 40px}}

  /* bottom nav (mobile) */
  .tabbar{position:fixed;bottom:0;inset-inline:0;z-index:30;display:flex;overflow-x:auto;scrollbar-width:none;
    background:var(--surface);border-top:1px solid var(--border);padding-bottom:env(safe-area-inset-bottom)}
  .tabbar::-webkit-scrollbar{display:none}
  @media(min-width:900px){.tabbar{display:none}}
  .tab{display:flex;flex-direction:column;align-items:center;gap:3px;padding:8px 4px;border:none;background:none;
    color:var(--mute);font-size:10px;font-weight:600;cursor:pointer;flex:0 0 auto;min-width:62px}
  .tab svg{width:21px;height:21px;stroke:var(--mute)}
  .tab.on{color:var(--accent)} .tab.on svg{stroke:var(--accent)}

  /* cards & bits */
  .card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);box-shadow:var(--shadow)}
  .sec{margin-bottom:24px}
  .sec>h2{font-size:.78rem;letter-spacing:.06em;color:var(--dim);font-weight:700;text-transform:uppercase;margin:0 2px 11px;
    display:flex;align-items:center;gap:8px}
  .sec>h2::before{content:"";width:14px;height:2px;background:var(--accent);border-radius:2px}
  .grid{display:grid;gap:13px}
  .lights{grid-template-columns:repeat(auto-fit,minmax(210px,1fr))}
  .light{display:flex;align-items:center;gap:12px;padding:13px 14px;border-radius:13px;background:var(--surface);
    border:1px solid var(--border);border-inline-start:4px solid var(--mute);box-shadow:var(--shadow)}
  .light .ic{width:36px;height:36px;border-radius:10px;display:grid;place-items:center;flex:0 0 auto}
  .light .ic svg{width:19px;height:19px}
  .light b{font-size:.9rem;display:block} .light small{font-size:.75rem;color:var(--dim)}
  .lv-good{border-inline-start-color:var(--good)} .lv-good .ic{background:var(--good-soft);color:var(--good)} .lv-good .ic svg{stroke:var(--good)}
  .lv-warn{border-inline-start-color:var(--warn)} .lv-warn .ic{background:var(--warn-soft);color:var(--warn)} .lv-warn .ic svg{stroke:var(--warn)}
  .lv-bad{border-inline-start-color:var(--bad)} .lv-bad .ic{background:var(--bad-soft);color:var(--bad)} .lv-bad .ic svg{stroke:var(--bad)}

  .gauges{grid-template-columns:repeat(auto-fit,minmax(270px,1fr))}
  .gcard{padding:18px 16px 14px;display:flex;flex-direction:column;align-items:center}
  .gcard h3{font-size:.82rem;color:var(--dim);font-weight:700;margin-bottom:2px}
  .gbig{font-size:2rem;font-weight:800;margin-top:-14px;letter-spacing:-.02em}
  .gmeta{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin-top:12px;width:100%}
  .gmeta .m{background:var(--surface-2);border-radius:10px;padding:7px 4px;text-align:center}
  .gmeta .m small{font-size:.66rem;color:var(--mute);display:block}
  .gmeta .m b{font-size:.86rem}

  .kpis{grid-template-columns:repeat(auto-fit,minmax(148px,1fr))}
  .kpi{padding:14px}
  .kpi small{font-size:.72rem;color:var(--dim);font-weight:600;display:flex;justify-content:space-between;align-items:center}
  .kpi small svg{width:15px;height:15px;stroke:var(--mute);opacity:.7}
  .kpi b{font-size:1.5rem;font-weight:800;display:block;margin-top:3px;letter-spacing:-.02em}

  .two{display:grid;gap:16px} @media(min-width:820px){.two{grid-template-columns:1.05fr 1fr}}
  .pad{padding:18px}
  .chip{display:inline-flex;align-items:center;gap:5px;font-size:.72rem;font-weight:700;padding:3px 9px;border-radius:99px;
    background:var(--surface-2);color:var(--dim);border:1px solid var(--border)}
  .chip.good{background:var(--good-soft);color:var(--good);border-color:transparent}
  .chip.warn{background:var(--warn-soft);color:var(--warn);border-color:transparent}
  .chip.bad{background:var(--bad-soft);color:var(--bad);border-color:transparent}
  .chip.acc{background:var(--accent-soft);color:var(--accent-ink);border-color:transparent}

  .row{display:flex;align-items:center;gap:12px;padding:12px 0;border-top:1px solid var(--border)}
  .row:first-child{border-top:none}
  .cnt{width:52px;height:52px;border-radius:12px;background:var(--surface-2);display:grid;place-items:center;flex:0 0 auto;text-align:center}
  .cnt b{font-size:1.1rem;font-weight:800;line-height:1;display:block} .cnt small{font-size:.6rem;color:var(--mute)}

  table{width:100%;border-collapse:collapse;font-size:.86rem;white-space:nowrap}
  .tscroll{overflow-x:auto}
  th{text-align:start;font-size:.72rem;color:var(--dim);font-weight:600;padding:10px 11px;border-bottom:1px solid var(--border);text-transform:uppercase;letter-spacing:.03em}
  td{padding:11px;border-bottom:1px solid var(--border)} tr:last-child td{border-bottom:none}
  tbody tr{cursor:pointer} tbody tr:hover{background:var(--surface-2)}

  .btn{display:inline-flex;align-items:center;gap:6px;background:var(--accent);color:#fff;border:none;border-radius:10px;
    padding:9px 15px;font-weight:700;font-size:.9rem;cursor:pointer}
  .btn:hover{filter:brightness(1.07)}
  .btn.ghost{background:var(--surface);color:var(--ink);border:1px solid var(--border)}
  .btn.sm{padding:6px 11px;font-size:.8rem}
  .btn svg{width:16px;height:16px;stroke:currentColor}
  input,select,textarea{font-family:inherit;font-size:.92rem;background:var(--surface);border:1px solid var(--border);color:var(--ink);
    border-radius:10px;padding:9px 11px;outline:none;width:100%}
  input:focus,select:focus,textarea:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
  .field{width:100%}
  .dropzone{display:block;width:100%;box-sizing:border-box;text-align:center;padding:20px 14px;border:2px dashed var(--border);border-radius:14px;background:var(--surface-2);cursor:pointer;transition:border-color .15s,background .15s}
  .dropzone:hover{border-color:var(--accent)}
  .dropzone.drag{border-color:var(--accent);background:var(--accent-soft)}
  .lbl{font-size:.74rem;color:var(--dim);font-weight:600;margin-bottom:5px;display:block}
  .fgrid{display:grid;gap:11px;grid-template-columns:repeat(auto-fit,minmax(140px,1fr))}
  .comp{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-top:14px}
  @media(min-width:560px){.comp{grid-template-columns:repeat(4,1fr)}}
  .comp .c{background:var(--surface-2);border-radius:10px;padding:9px;text-align:center}
  .comp .c small{font-size:.66rem;color:var(--mute);display:block} .comp .c b{font-size:.95rem}

  .needle{transition:transform .9s cubic-bezier(.2,.9,.3,1.2)}
  @media(prefers-reduced-motion:reduce){.needle{transition:none}}
  .barcard{padding:16px}
  .barcard h3{font-size:.82rem;font-weight:700;margin-bottom:10px}
  .empty{padding:44px 16px;text-align:center;color:var(--mute)}
  .empty b{display:block;color:var(--dim);font-size:.95rem}
  .banner{display:flex;align-items:center;gap:11px;padding:12px 14px;border-radius:12px;margin-bottom:14px;font-size:.86rem;font-weight:600}
  .banner svg{width:19px;height:19px;flex:0 0 auto}
  .banner.warn{background:var(--warn-soft);color:var(--warn)} .banner.bad{background:var(--bad-soft);color:var(--bad)}
  .foot{text-align:center;color:var(--mute);font-size:.74rem;margin-top:28px}

  /* modal */
  .ov{position:fixed;inset:0;z-index:50;display:flex;align-items:flex-end;justify-content:center;background:rgba(16,35,44,.45)}
  @media(min-width:560px){.ov{align-items:center;padding:16px}}
  .modal{background:var(--surface);border:1px solid var(--border);border-radius:18px 18px 0 0;width:100%;max-width:520px;
    max-height:92dvh;overflow:auto;box-shadow:var(--shadow-lg)}
  @media(min-width:560px){.modal{border-radius:18px}}
  .mhead{display:flex;align-items:center;justify-content:space-between;padding:16px 18px;border-bottom:1px solid var(--border);position:sticky;top:0;background:var(--surface)}
  .mhead h3{font-size:1.05rem;font-weight:800}
  .mbody{padding:18px}
  .x{background:var(--surface-2);border:none;border-radius:9px;width:32px;height:32px;cursor:pointer;color:var(--dim);display:grid;place-items:center}
  .x svg{width:17px;height:17px;stroke:var(--dim)}
  .ico16{width:16px;height:16px;stroke:var(--mute);flex:0 0 auto}
  .ic22{width:22px;height:22px;stroke:currentColor}
  .toast{position:fixed;bottom:80px;inset-inline:0;margin:auto;width:max-content;max-width:88%;background:var(--ink);color:var(--surface);
    padding:10px 18px;border-radius:12px;font-weight:700;font-size:.86rem;z-index:60;opacity:0;transition:opacity .25s,transform .25s;transform:translateY(8px)}
  .toast.show{opacity:1;transform:translateY(0)}
</style>

<div id="app">
  <div class="shell">
    <aside class="side">
      <div class="brand">
        <div class="logo">פ</div>
        <div><b>מערכת ניהול פרגו</b><span>פיצה פרגו · צור הדסה</span></div>
      </div>
      <div id="sidenav"></div>
      <div style="margin-top:auto;font-size:.72rem;color:var(--mute);padding:6px">גרסה 1 · הנתונים נשמרים במכשיר</div>
    </aside>

    <div class="main">
      <header class="head">
        <div class="mbrand"><div class="mlogo">פ</div><b style="font-size:1.02rem">פרגו</b></div>
        <div class="mtitle" id="ptitle" style="display:none"></div>
        <span class="modechip">● מצב מקומי</span>
        <div class="today"><b id="tGreg"></b><span id="tHeb"></span></div>
      </header>
      <div class="wrap" id="main"></div>
    </div>
  </div>

  <nav class="tabbar" id="tabbar"></nav>
</div>

<div id="modal-root"></div>
<div class="toast" id="toast"></div>

function metrics(){
  const t=new Date(todayISO()+'T00:00:00'), y=t.getFullYear(), m=t.getMonth();

  const rows=S.journal.filter(e=>{const d=new Date(e.date+'T00:00:00');return d.getFullYear()===y&&d.getMonth()===m&&N(e.revenue)>0;});
  const cum=rows.reduce((s,e)=>s+N(e.revenue),0), n=rows.length, avgDaily=n?cum/n:0, pace=avgDaily*dim;
  const target=N(S.settings.monthly_target), rem=Math.max(0,target-cum), left=Math.max(0,dim-refDay);
  const tx=rows.reduce((s,e)=>s+N(e.transactions),0);
  const today=S.journal.find(e=>e.date===todayISO());
  return {cum,n,dim,avgDaily,pace,target,rem,left,needed:left?rem/left:0,
    pct:target?cum/target:0,pacePct:target?pace/target:0,tx,avgOrder:tx?cum/tx:0,
    deliveries:rows.reduce((s,e)=>s+N(e.deliveries),0),pickup:rows.reduce((s,e)=>s+N(e.pickup),0),
    dineIn:rows.reduce((s,e)=>s+N(e.dine_in),0),todayRev:N(today&&today.revenue),

function cashStat(){

  const rows=S.journal.filter(e=>{const d=new Date(e.date+'T00:00:00');return d.getFullYear()===y&&d.getMonth()===m;});

    received:cr,deposited:cd,toDep:cr-cd,diff,depWarn:(cr-cd)>N(S.settings.cash_deposit_alert),diffAlert:Math.abs(diff)>.5};

function nextEvent(ref,win=14){
  ref=ref||todayISO(); const rt=new Date(ref+'T00:00:00').getTime();
  const rows=SEED.calendar.filter(c=>c.event&&!MINOR.has(c.event.trim())).sort((a,b)=>a.date<b.date?-1:1);
  const per=[]; for(const c of rows){const ev=c.event.trim(),last=per[per.length-1];
    const cons=last?(new Date(c.date)-new Date(last.end))/864e5<=1:false;
    if(last&&last.event===ev&&cons)last.end=c.date; else per.push({event:ev,start:c.date,end:c.date,c});}
  const cand=per.map(p=>{const st=new Date(p.start+'T00:00:00').getTime(),en=new Date(p.end+'T00:00:00').getTime();
    return {p,active:st<=rt&&rt<=en,days:Math.round((st-rt)/864e5)};}).filter(x=>x.active||x.days>=0)
    .sort((a,b)=>a.active===b.active?a.days-b.days:a.active?-1:1);
  const ch=cand[0]; if(!ch||(!ch.active&&ch.days>win))return null;
  return {...ch.p.c,event:ch.p.event,start:ch.p.start,days:Math.max(0,ch.days),active:ch.active};
}

    if(last&&last.event===ev&&cons)last.end=c.date;else per.push({event:ev,start:c.date,end:c.date,c});}
  return per.map(p=>{const days=Math.round((new Date(p.start)-new Date(t))/864e5);
    return {...p.c,event:p.event,start:p.start,end:p.end,days,active:p.start<=t&&p.end>=t};})

function gauge(val,max,zones){
  const f=max>0?Math.max(0,Math.min(val/max,1)):0, cx=100,cy=100,r=80, ang=180-f*180;
  const pol=d=>{const a=d*Math.PI/180;return [cx+r*Math.cos(a),cy-r*Math.sin(a)];};
  let prev=0,arcs='';
  (zones||[[.5,'var(--bad)'],[.8,'var(--warn)'],[1,'var(--good)']]).forEach(([to,col])=>{
    const [x0,y0]=pol(180-prev*180),[x1,y1]=pol(180-to*180);prev=to;
    arcs+=`<path d="M ${x0.toFixed(1)} ${y0.toFixed(1)} A ${r} ${r} 0 0 1 ${x1.toFixed(1)} ${y1.toFixed(1)}" fill="none" stroke="${col}" stroke-width="12" stroke-linecap="round"/>`;
  });
  const [nx,ny]=pol(ang);
  return `<svg viewBox="0 8 200 110" style="width:100%;max-width:290px">
    <path d="M 20 100 A 80 80 0 0 1 180 100" fill="none" stroke="var(--surface-2)" stroke-width="12" stroke-linecap="round"/>
    ${arcs}<line class="needle" x1="100" y1="100" x2="${nx.toFixed(1)}" y2="${ny.toFixed(1)}" stroke="var(--ink)" stroke-width="3.4" stroke-linecap="round"/>
    <circle cx="100" cy="100" r="6" fill="var(--ink)"/><circle cx="100" cy="100" r="2.4" fill="var(--surface)"/></svg>`;
}
function bars(data,color,fmt){
  if(!data.length)return `<div class="empty">אין נתונים</div>`;
  const max=Math.max(...data.map(d=>d.v))||1,W=100,H=64,bw=W/data.length*0.6,gap=W/data.length;
  let b='';data.forEach((d,i)=>{const h=Math.max(2,d.v/max*(H-14)),x=i*gap+(gap-bw)/2,yv=H-h-12;
    b+=`<rect x="${x.toFixed(1)}" y="${yv.toFixed(1)}" width="${bw.toFixed(1)}" height="${h.toFixed(1)}" rx="1.6" fill="${color}"/>
        <text x="${(x+bw/2).toFixed(1)}" y="${H-3}" font-size="4.4" fill="var(--mute)" text-anchor="middle">${d.name}</text>`;});
  return `<svg viewBox="0 0 100 ${H}" style="width:100%;height:150px" preserveAspectRatio="none">${b}</svg>`;
}

  const idx=s=>STAGES.indexOf(s),followups=S.leads.filter(l=>idx(l.stage)>=idx('טעימה נשלחה')&&idx(l.stage)<idx('הזמנה ראשונה')).length;

function saveDecision(id){const g=k=>document.getElementById(k).value;if(!g('dc_title'))return;
  const o={title:g('dc_title'),status:g('dc_status'),invest:N(g('dc_invest')),expReturn:N(g('dc_exp')),
    measured:g('dc_meas')===''?null:N(g('dc_meas')),verdict:g('dc_verdict')||null,note:g('dc_note')||null,
    date:((id&&S.decisions.find(x=>x.id===id))||{}).date||todayISO()};
  if(id){Object.assign(S.decisions.find(x=>x.id===id),o);}else{o.id='dc'+Date.now();S.decisions.unshift(o);}
  save();closeModal();render();toast('ההחלטה נשמרה');}

const kpi=(k,v,ic,lvl,d)=>`<div class="card kpi" ${d?`style="cursor:pointer" onclick="drill('${d[0]}','${d[1]}','${String(d[2]).replace(/'/g,'')}')"`:''}><small>${k} ${svg(ic)}</small><b class="tnum" style="color:${lvl?`var(--${lvl})`:'var(--ink)'}">${v}</b>${d?`<div style="font-size:.64rem;color:var(--accent);margin-top:3px;font-weight:700">לפירוט ›</div>`:''}</div>`;

function screenJournal(){
  let rows=[...S.journal].sort((a,b)=>a.date<b.date?1:-1);
  const f=(DRILL&&DRILL.tab==='journal')?DRILL.filter:null,t=todayISO();
  if(f==='today')rows=rows.filter(e=>e.date===t);
  else if(f==='month'){const d=new Date(t);rows=rows.filter(e=>{const x=new Date(e.date);return x.getMonth()===d.getMonth()&&x.getFullYear()===d.getFullYear();});}
  else if(f==='diff')rows=rows.filter(e=>Math.abs(payTotals(e).diff)>0.5);
  else if(f==='deposit')rows=rows.filter(e=>payTotals(e).toDep>0);
  const fLabel={today:'היום בלבד',month:'החודש הנוכחי',diff:'ימים עם הפרש תשלום',deposit:'ימים עם מזומן להפקדה'}[f];
  return `<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;gap:10px;flex-wrap:wrap">
    <div style="font-size:.86rem;color:var(--dim)">${fLabel?`מסונן: <b>${fLabel}</b> · ${rows.length} רשומות`:`${S.journal.length} ימים הוזנו · ימים ריקים לא נספרים בגרפים`}</div>

  const m=metrics();
  const daily=wd.map(e=>({name:gregS(e.date),v:N(e.revenue)}));
  let acc=0;const cum=wd.map(e=>{acc+=N(e.revenue);return {name:gregS(e.date),v:acc};});

const STAGES=['אותר','טעימה נשלחה','שיחת מעקב','הזמנה ראשונה','לקוח קבוע'];
const LTARGET={'אותר':100,'טעימה נשלחה':100,'שיחת מעקב':50,'הזמנה ראשונה':20,'לקוח קבוע':10};
function screenLeads(){

  if(f==='הזמנה ראשונה')list=S.leads.filter(l=>idx(l.stage)>=idx('הזמנה ראשונה'));
  else if(f==='לקוח קבוע')list=S.leads.filter(l=>l.stage==='לקוח קבוע');
  return `<div class="sec"><h2>משפך לקוחות עסקיים (יעד רבעוני)</h2>
    <div class="grid" style="grid-template-columns:repeat(auto-fit,minmax(138px,1fr))">${STAGES.map(s=>{
      const v=s==='אותר'?S.leads.length:reached(s),t=LTARGET[s],pct=Math.min(100,Math.round(v/t*100));

        <div style="height:5px;border-radius:5px;background:var(--surface-2);margin-top:8px;overflow:hidden"><div style="height:100%;width:${pct}%;background:var(--accent)"></div></div></div>`;}).join('')}</div></div>

    ${list.length?`<div class="grid" style="gap:10px">${list.map(l=>`<div class="card pad" style="display:flex;align-items:center;gap:12px;cursor:pointer" onclick="openLead('${l.id}')">

/* ---------- לוח משמרות שבועי ---------- */
const ROLES_HE=['טבח','מלצרית','מארחת','מנהל'];
const CRIT='טבח'; // תפקיד קריטי
function weekDates(off=0){const now=new Date();now.setHours(0,0,0,0);const sun=new Date(now);sun.setDate(now.getDate()-now.getDay()+off*7);
  return Array.from({length:7},(_,i)=>{const d=new Date(sun);d.setDate(sun.getDate()+i);return d.toISOString().slice(0,10);});}
function empById(){const m={};S.employees.forEach(e=>m[e.id]=e);return m;}
function approvedOf(sid,role){return S.shiftApps.filter(a=>a.shiftId===sid&&a.role===role&&a.status==='approved');}
function pendingOf(sid,role){return S.shiftApps.filter(a=>a.shiftId===sid&&a.role===role&&a.status==='pending');}
function shiftRoles(s){return Object.keys(s.req||{}).filter(r=>N(s.req[r])>0);}
function shiftStatus(s){const miss=[];let crit=false;
  shiftRoles(s).forEach(r=>{const m=N(s.req[r])-approvedOf(s.id,r).length;if(m>0){miss.push({role:r,count:m});if(r===CRIT)crit=true;}});
  if(!miss.length)return {key:'full',color:'good',miss};
  return crit?{key:'critical',color:'bad',miss}:{key:'partial',color:'warn',miss};}
function hoursOf(s){const p=t=>{if(!t)return 0;const a=t.split(':');return +a[0]+(+a[1]||0)/60;};let d=p(s.end)-p(s.start);if(d<0)d+=24;return d;}
function shiftCost(s){const h=hoursOf(s),m=empById();
  return S.shiftApps.filter(a=>a.shiftId===s.id&&a.status==='approved').reduce((t,a)=>t+N(m[a.empId]&&m[a.empId].hourly_cost)*h,0);}
function weekStats(wk){const shifts=S.shifts.filter(s=>wk.includes(s.date));
  let full=0,openS=0,missing=0,cost=0;const missDays=new Set(),missRoles={};
  shifts.forEach(s=>{const st=shiftStatus(s);cost+=shiftCost(s);
    if(st.key==='full')full++;else{openS++;st.miss.forEach(m=>{missing+=m.count;missRoles[m.role]=(missRoles[m.role]||0)+m.count;missDays.add(s.date);});}});
  return {total:shifts.length,full,openS,missing,cost,missDays:[...missDays],missRoles};}

  } else if(vEmp){
    h+=`<div class="banner" style="background:var(--accent-soft);color:var(--accent-ink);margin-bottom:14px">${svg('users')}שלום ${vEmp.name} — מוצגות רק משמרות שדורשות ${vEmp.role}. לחצו על משמרת פנויה כדי להירשם.</div>`;
  }
  h+=`<div class="tscroll"><div style="display:flex;gap:10px;min-width:840px">`;
  wk.forEach((d,i)=>{
    const ds=S.shifts.filter(s=>s.date===d).filter(s=>isMgr||(vEmp&&N((s.req||{})[vEmp.role])>0));
    h+=`<div style="flex:1;min-width:150px"><div style="text-align:center;padding:8px;border-radius:10px;background:var(--surface-2);margin-bottom:8px">
      <div style="font-weight:800">${WD[i]}</div><div style="font-size:.72rem;color:var(--dim)">${gregS(d)}</div></div>
      <div style="display:flex;flex-direction:column;gap:8px">`;
    if(!ds.length)h+=`<div style="text-align:center;color:var(--mute);font-size:.76rem;padding:6px">—</div>`;
    ds.forEach(s=>{const st=shiftStatus(s);
      h+=`<div class="card" style="padding:10px;cursor:pointer;border-inline-start:4px solid var(--${st.color})" onclick="openShiftDrawer('${s.id}')">
        <div style="display:flex;justify-content:space-between;align-items:center"><b style="font-size:.86rem">${s.type}</b><span style="font-size:.66rem;color:var(--mute)">${s.start}-${s.end}</span></div>
        <div style="display:flex;gap:4px;flex-wrap:wrap;margin-top:6px">${shiftRoles(s).map(r=>{const ap=approvedOf(s.id,r).length,met=ap>=N(s.req[r]);
          return `<span class="chip ${met?'good':(r===CRIT?'bad':'warn')}" style="font-size:.64rem;padding:2px 6px">${r} ${ap}/${N(s.req[r])}</span>`;}).join('')}</div></div>`;});
    h+=`</div></div>`;});
  h+=`</div></div>`;
  if(isMgr){h+=`<div class="sec" style="margin-top:24px"><h2>ניהול עובדים (${S.employees.length})</h2>
    <div style="display:flex;justify-content:flex-end;margin-bottom:10px"><button class="btn sm" onclick="openEmp()">${svg('plus')} עובד</button></div>
    <div class="grid" style="grid-template-columns:repeat(auto-fill,minmax(205px,1fr))">${S.employees.map(e=>`<div class="card pad" style="cursor:pointer" onclick="openEmp('${e.id}')">
      <div style="display:flex;justify-content:space-between;align-items:start"><b>${e.name}</b><span class="chip ${e.status==='פעיל'?'good':'warn'}">${e.status}</span></div>
      <div style="font-size:.76rem;color:var(--dim);margin-top:4px">${e.role} · ${e.phone||''}</div>
      <div style="font-size:.76rem;margin-top:3px">${money(e.hourly_cost)}/שעה</div></div>`).join('')}</div></div>`;}
  return h;
}
function openShiftDrawer(id){
  const s=S.shifts.find(x=>x.id===id);if(!s)return;
  const isMgr=(!S.viewer||S.viewer.mode==='manager'),m=empById();
  const vEmp=(!isMgr&&S.viewer.empId)?m[S.viewer.empId]:null,st=shiftStatus(s);
  let b=`<div style="display:flex;gap:8px;align-items:center;margin-bottom:6px">
      <span class="chip ${st.color}">${st.key==='full'?'מלא':st.key==='critical'?'חסר קריטי':'חסר חלקית'}</span>
      <span style="color:var(--dim);font-size:.84rem">${WD[new Date(s.date).getDay()]} · ${gregD(s.date)} · ${s.start}-${s.end}</span></div>
    <div style="font-size:.8rem;color:var(--dim);margin-bottom:12px">עלות שכר משוערת: <b>${money(shiftCost(s))}</b> · ${hoursOf(s)} שעות</div>`;
  shiftRoles(s).forEach(r=>{const ap=approvedOf(s.id,r),pe=pendingOf(s.id,r),need=N(s.req[r]);
    b+=`<div class="card pad" style="margin-bottom:10px"><div style="display:flex;justify-content:space-between;align-items:center">
      <b>${r}</b><span class="chip ${ap.length>=need?'good':(r===CRIT?'bad':'warn')}">${ap.length}/${need} שובצו</span></div>`;
    ap.forEach(a=>b+=`<div style="display:flex;justify-content:space-between;align-items:center;margin-top:7px;font-size:.85rem">
      <span style="color:var(--good)">✓ ${m[a.empId]?m[a.empId].name:'?'}</span>${isMgr?`<button class="chip bad" style="cursor:pointer" onclick="removeApp('${a.id}')">הסר</button>`:''}</div>`);
    pe.forEach(a=>b+=`<div style="display:flex;justify-content:space-between;align-items:center;margin-top:7px;font-size:.85rem">
      <span style="color:var(--warn)">⏳ ${m[a.empId]?m[a.empId].name:'?'}</span>
      ${isMgr?`<span style="display:flex;gap:5px"><button class="chip good" style="cursor:pointer" onclick="approveApp('${a.id}')">אשר</button><button class="chip bad" style="cursor:pointer" onclick="removeApp('${a.id}')">דחה</button></span>`:''}</div>`);
    if(vEmp&&vEmp.role===r){const mine=S.shiftApps.find(a=>a.shiftId===s.id&&a.empId===vEmp.id);
      if(mine)b+=`<div style="margin-top:9px;font-size:.85rem;color:${mine.status==='approved'?'var(--good)':'var(--warn)'}">${mine.status==='approved'?'✓ שובצת למשמרת':'⏳ נרשמת — ממתין לאישור מנהל'}</div>`;
      else b+=`<button class="btn" style="margin-top:9px;width:100%" onclick="applyShift('${s.id}','${r}')">${svg('check')} אני פנוי / הירשם למשמרת</button>`;}
    if(isMgr)b+=`<div style="display:flex;gap:6px;margin-top:9px;align-items:center"><span style="font-size:.74rem;color:var(--dim)">דרישה:</span>
      <button class="chip" style="cursor:pointer" onclick="setReq('${s.id}','${r}',-1)">−</button><span class="chip">${need}</span>
      <button class="chip" style="cursor:pointer" onclick="setReq('${s.id}','${r}',1)">+</button></div>`;
    b+=`</div>`;});
  if(isMgr)b+=`<div style="margin-top:4px"><label class="lbl">הערות מנהל</label><input id="sh_notes" value="${s.notes||''}" onchange="saveShiftNotes('${s.id}',this.value)"></div>

      <select id="sh_addrole" style="width:auto"><option value="">הוסף דרישת תפקיד…</option>${ROLES_HE.filter(r=>r!=='מנהל'&&!(N((s.req||{})[r])>0)).map(r=>`<option>${r}</option>`).join('')}</select>
      <button class="btn ghost sm" onclick="addRole('${s.id}')">${svg('plus')} הוסף</button>
      <button class="btn ghost sm" style="color:var(--bad);margin-inline-start:auto" onclick="delShift('${s.id}')">${svg('trash-2')} מחק</button></div>`;
  modal(s.type+' · '+WD[new Date(s.date).getDay()],b);
}
function setViewer(mode){const first=S.employees.find(e=>e.role!=='מנהל');S.viewer={mode,empId:mode==='employee'?((S.viewer&&S.viewer.empId)||(first&&first.id)):null};save();render();}
function setViewerEmp(id){S.viewer={mode:'employee',empId:id};save();render();}
function weekNav(d){S.weekOffset=(S.weekOffset||0)+d;save();render();}
function approveApp(id){const a=S.shiftApps.find(x=>x.id===id);if(a)a.status='approved';save();render();openShiftDrawer(a.shiftId);}
function removeApp(id){const a=S.shiftApps.find(x=>x.id===id),sid=a&&a.shiftId;S.shiftApps=S.shiftApps.filter(x=>x.id!==id);save();render();if(sid)openShiftDrawer(sid);}
function applyShift(sid,role){if(!S.viewer||!S.viewer.empId)return;
  S.shiftApps.push({id:'ap'+Date.now(),shiftId:sid,empId:S.viewer.empId,role,status:'pending'});save();render();openShiftDrawer(sid);toast('נרשמת — ממתין לאישור מנהל');}
function setReq(sid,role,delta){const s=S.shifts.find(x=>x.id===sid);s.req=s.req||{};s.req[role]=Math.max(0,N(s.req[role])+delta);save();render();openShiftDrawer(sid);}
function addRole(sid){const v=document.getElementById('sh_addrole').value;if(!v)return;const s=S.shifts.find(x=>x.id===sid);s.req=s.req||{};s.req[v]=Math.max(1,N(s.req[v]));save();render();openShiftDrawer(sid);}
function saveShiftNotes(sid,v){const s=S.shifts.find(x=>x.id===sid);if(s)s.notes=v||null;save();}

const FEAS_DEF={name:'',category:'פיצה',desc:'',kind:'קבועה',
  food:'',prepMin:'',laborHr:'45',packaging:'',other:'',
  manualPrice:'',targetFc:(S.settings.food_cost_target||34),mult:'3',justify:'1500',
  audience:[],timing:[],solves:[],
  newIngredient:false,newEquip:false,training:false,prepAhead:false,complexity:'בינונית',wasteRisk:'נמוך',shelf:'',
  pilot:false,pilotStart:'',pilotEnd:'',pilotSalesTarget:'',pilotGrossTarget:'',pilotActual:'',decision:'—'};
let FEAS=Object.assign({},FEAS_DEF,S.feasDraft||{});
const psychPrice=x=>{if(x<=0)return 0;let b=Math.ceil(x/10)*10-1;if(b<x)b+=10;return b;};
function evalDish(f){
  const labor=(N(f.prepMin)/60)*N(f.laborHr), total=N(f.food)+labor+N(f.packaging)+N(f.other);
  const tFc=N(f.targetFc)||34, mult=N(f.mult)||3;
  const minByFc=tFc>0?N(f.food)/(tFc/100):0;
  const recommended=psychPrice(Math.max(minByFc,total*mult));
  const price=N(f.manualPrice)>0?N(f.manualPrice):recommended;
  const fcPct=price>0?N(f.food)/price*100:0, gross=price-N(f.food), grossPct=price>0?gross/price*100:0, net=price-total;
  let sc=5;
  if(fcPct<=tFc)sc+=2; else if(fcPct<=tFc+5)sc+=0; else sc-=2;
  if(grossPct>=60)sc+=1; if(grossPct<40&&price>0)sc-=1; if(net<=0&&price>0)sc-=2;
  if(f.newIngredient)sc-=1; if(f.newEquip)sc-=1; if(f.training)sc-=.5;
  if(f.complexity==='גבוהה')sc-=1; if(f.complexity==='נמוכה')sc+=.5;
  if(f.wasteRisk==='גבוה')sc-=1.5; else if(f.wasteRisk==='בינוני')sc-=.5;
  if(f.prepAhead)sc+=.5;
  sc+=Math.min(1.5,(f.solves||[]).length*.5)+Math.min(1,(f.timing||[]).length*.25);
  sc=Math.max(1,Math.min(10,Math.round(sc)));
  let color,verdict;
  if(sc>=7&&net>0&&fcPct<=tFc+4){color='good';verdict='מומלץ להכניס';}
  else if(sc>=4&&net>0){color='warn';verdict='להכניס רק לפיילוט';}
  else{color='bad';verdict='לא מומלץ כרגע';}
  const justify=N(f.justify)||1500, units=gross>0?Math.ceil(justify/gross):null;
  const camp=(f.timing||[]).filter(t=>['שישי','מוצאי שבת','חגים / תקופות מיוחדות'].includes(t))
    .concat((f.audience||[]).filter(a=>['בין המצרים','סעודה רביעית'].includes(a)));
  return {labor,total,minByFc,recommended,price,fcPct,gross,grossPct,net,score:sc,color,verdict,units,justify,camp};
}
function evalText(f,r){
  if(!f.name&&!N(f.food))return 'מלאו את פרטי המנה והעלויות לקבלת המלצה מבוססת נתונים.';
  const p=[];const tFc=N(f.targetFc)||34;
  if(r.color==='good')p.push(`המנה נראית כדאית, פוד קוסט צפוי ${Math.round(r.fcPct)}%.`);
  else if(r.color==='warn')p.push(`המנה גבולית מבחינת רווחיות — מומלץ להתחיל בפיילוט.`);
  else p.push(`המנה לא מספיק רווחית כרגע.`);
  if(r.fcPct>tFc&&r.recommended>0)p.push(`מומלץ להעלות מחיר ל-${r.recommended} ₪ או להוזיל חומרי גלם.`);
  if(f.wasteRisk==='גבוה')p.push(`סיכון בזבוז גבוה — מומלץ פיילוט קצר (14 יום).`);
  if(f.newEquip)p.push(`דורשת ציוד חדש — לשקול עלות ההשקעה מול הביקוש.`);
  if(r.camp.length)p.push(`מתאימה במיוחד ל: ${[...new Set(r.camp)].join(', ')}.`);
  return p.join(' ');
}

  const hasEmp=docEmp.some(r=>r.employer!=null),hasTot=docEmp.some(r=>r.total!=null);

function confirmEmp(){if(!docEmp.length)return;let add=0,upd=0;

let docFileMeta=null,lastUploadId=null;
function csvRows(text){
  const nl=text.replace(/\r\n?/g,'\n');const firstLine=(nl.split('\n')[0]||'');
  const delim=(firstLine.split('\t').length>firstLine.split(',').length)?'\t':(firstLine.split(';').length>firstLine.split(',').length?';':',');
  const rows=[];let row=[],cell='',q=false;
  for(let i=0;i<nl.length;i++){const ch=nl[i];
    if(q){if(ch==='"'){if(nl[i+1]==='"'){cell+='"';i++;}else q=false;}else cell+=ch;}
    else{if(ch==='"')q=true;else if(ch===delim){row.push(cell);cell='';}
      else if(ch==='\n'){row.push(cell);rows.push(row);row=[];cell='';}else cell+=ch;}}
  if(cell!==''||row.length){row.push(cell);rows.push(row);}
  return rows;}
function colIndex(ref){const m=/^([A-Z]+)/.exec(ref||'');if(!m)return 0;let n=0;for(const ch of m[1])n=n*26+(ch.charCodeAt(0)-64);return n-1;}
async function inflateRaw(bytes){const ds=new DecompressionStream('deflate-raw');
  const stream=new Blob([bytes]).stream().pipeThrough(ds);
  return new Uint8Array(await new Response(stream).arrayBuffer());}
async function unzip(ab){const dv=new DataView(ab),u8=new Uint8Array(ab),files={};
  let eocd=-1;for(let i=u8.length-22;i>=0;i--){if(dv.getUint32(i,true)===0x06054b50){eocd=i;break;}}
  if(eocd<0)throw new Error('not a zip');
  const cnt=dv.getUint16(eocd+10,true);let off=dv.getUint32(eocd+16,true);
  for(let n=0;n<cnt&&off+46<=u8.length;n++){if(dv.getUint32(off,true)!==0x02014b50)break;
    const method=dv.getUint16(off+10,true),csize=dv.getUint32(off+20,true),
      fnlen=dv.getUint16(off+28,true),exlen=dv.getUint16(off+30,true),cmlen=dv.getUint16(off+32,true),
      lho=dv.getUint32(off+42,true);
    const name=new TextDecoder().decode(u8.subarray(off+46,off+46+fnlen));
    const lfn=dv.getUint16(lho+26,true),lex=dv.getUint16(lho+28,true),dataStart=lho+30+lfn+lex;
    files[name]={method,comp:u8.subarray(dataStart,dataStart+csize)};
    off+=46+fnlen+exlen+cmlen;}
  return files;}
async function zipEntry(files,name){const f=files[name];if(!f)return null;return f.method===0?f.comp:await inflateRaw(f.comp);}
async function xlsxRows(ab){
  const files=await unzip(ab),dec=new TextDecoder();
  let shared=[];const ss=await zipEntry(files,'xl/sharedStrings.xml');
  if(ss){const doc=new DOMParser().parseFromString(dec.decode(ss),'application/xml');
    shared=[...doc.getElementsByTagName('si')].map(si=>[...si.getElementsByTagName('t')].map(t=>t.textContent).join(''));}
  let sheet='xl/worksheets/sheet1.xml';
  if(!files[sheet]){const k=Object.keys(files).find(n=>/^xl\/worksheets\/sheet\d+\.xml$/.test(n));if(k)sheet=k;}
  const sh=await zipEntry(files,sheet);if(!sh)return [];
  const doc=new DOMParser().parseFromString(dec.decode(sh),'application/xml'),rows=[];
  [...doc.getElementsByTagName('row')].forEach(r=>{const cells=[];
    [...r.getElementsByTagName('c')].forEach(c=>{const col=colIndex(c.getAttribute('r')),t=c.getAttribute('t');

    `<div style="display:grid;gap:11px"><div><label class="lbl">שם המשימה</label><input id="t_title" value="${t.title||''}"></div>
     <div class="fgrid"><div><label class="lbl">תחום</label><select id="t_cat"><option value=""></option>${opt(['שיווק','תפריט','תפעול','כספים','ספקים','שירות','עובדים','כשרות','מכירות','אסטרטגיה'],t.category)}</select></div>
       <div><label class="lbl">אחראי</label><input id="t_owner" value="${t.owner||''}"></div>
       <div><label class="lbl">סטטוס</label><select id="t_status">${opt(['מתוכנן','בתהליך','בוצע','תקוע'],t.status)}</select></div>
       <div><label class="lbl">עדיפות</label><select id="t_pri">${opt(['גבוהה','רגילה','נמוכה'],t.priority)}</select></div></div></div>`,
    `<button class="btn" onclick="saveTask('${id||''}')">${svg('check')} שמירה</button>
     ${id?`<button class="btn ghost" style="color:var(--bad)" onclick="delTask('${id}')">מחיקה</button>`:''}`);
}
function saveTask(id){const g=k=>document.getElementById(k).value; if(!g('t_title'))return;
  const o={title:g('t_title'),category:g('t_cat')||null,owner:g('t_owner')||null,status:g('t_status'),priority:g('t_pri')};
  if(id){Object.assign(S.tasks.find(x=>x.id===id),o);}else{o.id='tk'+Date.now();S.tasks.unshift(o);}
  save();closeModal();render();toast('נשמר');}
function delTask(id){S.tasks=S.tasks.filter(x=>x.id!==id);save();closeModal();render();toast('נמחק');}
function toggleTask(id){const t=S.tasks.find(x=>x.id===id);t.status=t.status==='בוצע'?'מתוכנן':'בוצע';save();render();}
function openDish(id){
  const mi=id?S.menu.find(x=>x.id===id):{status:'רעיון'};
  const opt=(arr,v)=>arr.map(o=>`<option ${o===v?'selected':''}>${o}</option>`).join('');
  modal(id?'עריכת מנה':'מנה חדשה',
    `<div style="display:grid;gap:11px"><div><label class="lbl">שם המנה</label><input id="d_name" value="${mi.name||''}"></div>
     <div class="fgrid"><div><label class="lbl">קטגוריה</label><input id="d_cat" value="${mi.category||''}"></div>
       <div><label class="lbl">סטטוס</label><select id="d_status">${opt(['רעיון','בבדיקה','בפיילוט','פעיל','ירד'],mi.status)}</select></div>
       <div><label class="lbl">מחיר מכירה (₪)</label><input type="number" id="d_price" value="${mi.price??''}" oninput="dishCalc()"></div>
       <div><label class="lbl">עלות חומרי גלם (₪)</label><input type="number" id="d_cost" value="${mi.cost??''}" oninput="dishCalc()"></div>
       <div><label class="lbl">מתאים לקמפיין</label><input id="d_camp" value="${mi.campaign||''}"></div></div>
     <div class="c" id="d_fc" style="background:var(--surface-2);border-radius:10px;padding:10px;text-align:center"></div></div>`,
    `<button class="btn" onclick="saveDish('${id||''}')">${svg('check')} שמירה</button>
     ${id?`<button class="btn ghost" style="color:var(--bad)" onclick="delDish('${id}')">מחיקה</button>`:''}`);
  dishCalc();
}
function dishCalc(){const p=N(document.getElementById('d_price').value),c=N(document.getElementById('d_cost').value);
  const fc=p>0?Math.round(c/p*1000)/10:null,tgt=N(S.settings.food_cost_target),high=fc!=null&&fc>tgt;
  document.getElementById('d_fc').innerHTML=`<small style="color:var(--mute)">פוד קוסט מחושב</small>
    <b style="font-size:1.15rem;color:${high?'var(--bad)':'var(--good)'}">${fc!=null?fc+'%':'—'}</b>
    ${high?`<div style="font-size:.72rem;color:var(--bad)">מעל היעד (${tgt}%)</div>`:''}`;}
function saveDish(id){const g=k=>document.getElementById(k).value; if(!g('d_name'))return;
  const o={name:g('d_name'),category:g('d_cat')||null,status:g('d_status'),price:g('d_price')===''?null:N(g('d_price')),cost:g('d_cost')===''?null:N(g('d_cost')),campaign:g('d_camp')||null};
  if(id){Object.assign(S.menu.find(x=>x.id===id),o);}else{o.id='mn'+Date.now();S.menu.push(o);}
  save();closeModal();render();toast('נשמר');}
function delDish(id){S.menu=S.menu.filter(x=>x.id!==id);save();closeModal();render();toast('נמחק');}

function openCash(){modal('עדכון יתרות',
  `<div style="display:grid;gap:11px">
    <div><label class="lbl">יתרת בנק (₪)</label><input type="number" id="c_bank" value="${S.cash.bank_balance??''}"></div>
    <div><label class="lbl">מזומן בקופה (₪)</label><input type="number" id="c_reg" value="${S.cash.cash_in_register??''}"></div>
    <div><label class="lbl">תשלומים פתוחים לספקים (₪)</label><input type="number" id="c_sup" value="${S.cash.open_supplier_payments??''}"></div></div>`,
  `<button class="btn" onclick="saveCash()">${svg('check')} שמירה</button>`);}
function saveCash(){const g=id=>document.getElementById(id).value;
  S.cash={bank_balance:g('c_bank')===''?null:N(g('c_bank')),cash_in_register:g('c_reg')===''?null:N(g('c_reg')),open_supplier_payments:g('c_sup')===''?null:N(g('c_sup'))};
  save();closeModal();render();toast('היתרות עודכנו');}

function openLead(id){const l=id?S.leads.find(x=>x.id===id):{stage:'אותר',letter:false};const opt=(a,v)=>a.map(o=>`<option ${o===v?'selected':''}>${o}</option>`).join('');
  modal(id?'עריכת לקוח':'לקוח חדש',
   `<div style="display:grid;gap:11px"><div><label class="lbl">שם העסק / מוסד</label><input id="l_name" value="${l.name||''}"></div>
    <div class="fgrid"><div><label class="lbl">קטגוריה</label><select id="l_cat"><option value=""></option>${opt(['בית ספר','ישיבה','עסק','משרד','מוסד'],l.category)}</select></div>
      <div><label class="lbl">שלב במשפך</label><select id="l_stage">${opt(STAGES,l.stage)}</select></div>
      <div><label class="lbl">איש קשר</label><input id="l_contact" value="${l.contact||''}"></div>
      <div><label class="lbl">טלפון</label><input id="l_phone" value="${l.phone||''}"></div>
      <div><label class="lbl">מנת טעימה</label><input id="l_tasting" value="${l.tasting||''}"></div></div>
    <label style="display:flex;gap:8px;align-items:center;font-size:.86rem"><input type="checkbox" id="l_letter" ${l.letter?'checked':''} style="width:auto"> צורף מכתב אישי</label></div>`,
   `<button class="btn" onclick="saveLead('${id||''}')">${svg('check')} שמירה</button>${id?`<button class="btn ghost" style="color:var(--bad)" onclick="delLead('${id}')">מחיקה</button>`:''}`);}
function saveLead(id){const g=x=>document.getElementById(x).value;if(!g('l_name'))return;
  const o={name:g('l_name'),category:g('l_cat')||null,stage:g('l_stage'),contact:g('l_contact')||null,phone:g('l_phone')||null,tasting:g('l_tasting')||null,letter:document.getElementById('l_letter').checked};
  if(id){Object.assign(S.leads.find(x=>x.id===id),o);}else{o.id='ld'+Date.now();S.leads.unshift(o);}save();closeModal();render();toast('נשמר');}
function delLead(id){S.leads=S.leads.filter(x=>x.id!==id);save();closeModal();render();toast('נמחק');}

function openEmp(id){const e=id?S.employees.find(x=>x.id===id):{status:'פעיל',role:'מלצרית'};const opt=(a,v)=>a.map(o=>`<option ${o===v?'selected':''}>${o}</option>`).join('');
  modal(id?'עריכת עובד':'עובד חדש',
   `<div style="display:grid;gap:11px"><div class="fgrid"><div><label class="lbl">שם</label><input id="e_name" value="${e.name||''}"></div>
      <div><label class="lbl">טלפון</label><input id="e_phone" value="${e.phone||''}" style="direction:ltr"></div>
      <div><label class="lbl">תפקיד</label><select id="e_role">${opt(ROLES_HE,e.role)}</select></div>
      <div><label class="lbl">סטטוס</label><select id="e_status">${opt(['פעיל','בהשהיה','סיים'],e.status)}</select></div>
      <div><label class="lbl">עלות שעתית (₪)</label><input type="number" id="e_cost" value="${e.hourly_cost??''}"></div></div>
      <div><label class="lbl">הערות</label><input id="e_notes" value="${e.notes||''}"></div>
      ${id?empEventsBlock(id):''}</div>`,
   `<button class="btn" onclick="saveEmp('${id||''}')">${svg('check')} שמירה</button>${id?`<button class="btn ghost" style="color:var(--bad)" onclick="delEmp('${id}')">מחיקה</button>`:''}`);}
function empEventsBlock(id){const evts=S.empEvents.filter(x=>x.empId===id).sort((a,b)=>a.date<b.date?1:-1);
  const col=t=>t==='שבח'?'good':t==='תלונה'||t==='חוסר מקצועיות'?'bad':'warn';
  return `<div style="border-top:1px solid var(--border);padding-top:12px;margin-top:4px">
    <div class="lbl">היסטוריית אירועים (${evts.length})</div>
    <div id="emp-ev-list" style="display:flex;flex-direction:column;gap:6px;max-height:150px;overflow:auto">
    ${evts.length?evts.map(x=>`<div style="display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:.82rem;background:var(--surface-2);border-radius:8px;padding:6px 9px">
      <span><span class="chip ${col(x.type)}">${x.type}</span> ${x.desc||''}</span><span style="color:var(--mute);font-size:.72rem;white-space:nowrap">${gregS(x.date)}</span></div>`).join(''):'<div style="color:var(--mute);font-size:.82rem">אין אירועים</div>'}</div>
    <div class="fgrid" style="margin-top:8px">
      <select id="ev_type">${['תלונה','איחור','ביטול משמרת','חוסר מקצועיות','שבח','אירוע חריג'].map(o=>`<option>${o}</option>`).join('')}</select>
      <select id="ev_sev">${['נמוכה','בינונית','גבוהה'].map(o=>`<option>${o}</option>`).join('')}</select></div>
    <div style="display:flex;gap:6px;margin-top:6px"><input id="ev_desc" placeholder="תיאור קצר"><button class="btn ghost sm" style="white-space:nowrap" onclick="logEmpEvent('${id}')">${svg('plus')} רשום</button></div></div>`;}
function logEmpEvent(id){const g=x=>document.getElementById(x).value;
  S.empEvents.push({id:'ee'+Date.now(),empId:id,type:g('ev_type'),severity:g('ev_sev'),desc:g('ev_desc')||null,date:todayISO()});
  save();openEmp(id);toast('האירוע נרשם');}
function saveEmp(id){const g=x=>document.getElementById(x).value;if(!g('e_name'))return;
  const o={name:g('e_name'),phone:g('e_phone')||null,role:g('e_role'),status:g('e_status'),hourly_cost:g('e_cost')===''?null:N(g('e_cost')),notes:g('e_notes')||null};
  if(id){Object.assign(S.employees.find(x=>x.id===id),o);}else{o.id='em'+Date.now();S.employees.push(o);}save();closeModal();render();toast('נשמר');}
function delEmp(id){S.employees=S.employees.filter(x=>x.id!==id);S.shiftApps=S.shiftApps.filter(a=>a.empId!==id);save();closeModal();render();toast('נמחק');}

function openShift(){const wk=weekDates(S.weekOffset||0);
  modal('משמרת חדשה',
   `<div style="display:grid;gap:11px"><div class="fgrid">
     <div><label class="lbl">תאריך</label><input type="date" id="ns_date" value="${wk[0]}"></div>
     <div><label class="lbl">סוג משמרת</label><select id="ns_type"><option>בוקר</option><option selected>ערב</option><option>מוצ״ש / לילה</option></select></div>
     <div><label class="lbl">שעת התחלה</label><input type="time" id="ns_start" value="16:00"></div>
     <div><label class="lbl">שעת סיום</label><input type="time" id="ns_end" value="23:00"></div>
     <div><label class="lbl">טבחים דרושים</label><input type="number" id="ns_cook" value="1"></div>
     <div><label class="lbl">מלצריות דרושות</label><input type="number" id="ns_wait" value="2"></div>
     <div><label class="lbl">מארחות דרושות</label><input type="number" id="ns_host" value="0"></div></div>
     <div><label class="lbl">הערות</label><input id="ns_notes"></div></div>`,
   `<button class="btn" onclick="saveShift()">${svg('check')} יצירת משמרת</button>`);}
function saveShift(){const g=id=>document.getElementById(id).value;if(!g('ns_date'))return;
  S.shifts.push({id:'sh'+Date.now(),date:g('ns_date'),type:g('ns_type'),start:g('ns_start'),end:g('ns_end'),notes:g('ns_notes')||null,
    req:{'טבח':N(g('ns_cook')),'מלצרית':N(g('ns_wait')),'מארחת':N(g('ns_host'))}});
  save();closeModal();render();toast('המשמרת נוצרה');}
function delShift(id){S.shifts=S.shifts.filter(x=>x.id!==id);S.shiftApps=S.shiftApps.filter(a=>a.shiftId!==id);save();closeModal();render();toast('המשמרת נמחקה');}

/* ---------- render ---------- */
let DRILL=null;
function go(t){DRILL=null;TAB=t;render();window.scrollTo(0,0);}
function drill(tab,filter,label){DRILL={tab,filter,label};TAB=tab;render();window.scrollTo(0,0);}
function drillBannerHTML(){
  if(!DRILL||DRILL.tab!==TAB)return '';
  return `<div class="banner" style="background:var(--accent-soft);color:var(--accent-ink);margin-bottom:14px;justify-content:space-between;flex-wrap:wrap;gap:8px">
    <span style="display:flex;align-items:center;gap:8px">${svg('search')} פירוט הנתון: <b>${DRILL.label}</b></span>
    <button class="btn ghost sm" onclick="go('dash')">← חזרה לדשבורד</button></div>`;
}
window.go=go;window.drill=drill;
function render(){
  const t=todayISO();
  document.getElementById('tGreg').textContent=weekday(t)+' · '+gregD(t);
  document.getElementById('tHeb').textContent=hebrew(t);
  const label=(TABS.find(x=>x[0]===TAB)||[])[1]||'';
  const pt=document.getElementById('ptitle');pt.textContent=label;
  document.getElementById('sidenav').innerHTML=TABS.map(([id,lbl,ic])=>
    `<button class="navitem ${TAB===id?'on':''}" onclick="go('${id}')">${svg(ic)}<span>${lbl}</span></button>`).join('');
  document.getElementById('tabbar').innerHTML=TABS.map(([id,lbl,ic])=>
    `<button class="tab ${TAB===id?'on':''}" onclick="go('${id}')">${svg(ic)}${lbl}</button>`).join('');
  const scr={advisor:screenAdvisor,money:screenMoney,sim:screenSim,decisions:screenDecisions,dash:screenDash,journal:screenJournal,cashflow:screenCashflow,calendar:screenCalendar,tasks:screenTasks,
    leads:screenLeads,menu:screenMenu,feas:screenFeas,reports:screenReports,employees:screenEmployees,zreport:screenZreport,docs:screenDocs,settings:screenSettings}[TAB];
  document.getElementById('main').innerHTML=drillBannerHTML()+scr();
  if(TAB==='sim')simCalc();
}
let toastT;function toast(m){const el=document.getElementById('toast');el.textContent=m;el.classList.add('show');clearTimeout(toastT);toastT=setTimeout(()=>el.classList.remove('show'),1800);}
window.openEntry=openEntry;window.saveEntry=saveEntry;window.onDate=onDate;window.liveCalc=liveCalc;
window.openTask=openTask;window.saveTask=saveTask;window.delTask=delTask;window.toggleTask=toggleTask;
window.openDish=openDish;window.saveDish=saveDish;window.delDish=delDish;window.dishCalc=dishCalc;
window.closeModal=closeModal;window.resetAll=resetAll;
window.openCash=openCash;window.saveCash=saveCash;window.openLead=openLead;window.saveLead=saveLead;window.delLead=delLead;
window.openEmp=openEmp;window.saveEmp=saveEmp;window.delEmp=delEmp;window.openShift=openShift;window.saveShift=saveShift;window.delShift=delShift;window.logEmpEvent=logEmpEvent;
window.openShiftDrawer=openShiftDrawer;window.setViewer=setViewer;window.setViewerEmp=setViewerEmp;window.weekNav=weekNav;
window.approveApp=approveApp;window.removeApp=removeApp;window.applyShift=applyShift;window.setReq=setReq;window.addRole=addRole;window.saveShiftNotes=saveShiftNotes;
window.setDocType=setDocType;window.analyzeDoc=analyzeDoc;window.loadDocSample=loadDocSample;window.confirmDoc=confirmDoc;window.renderDocPreview=renderDocPreview;window.delAnalysis=delAnalysis;
window.saveSettings=saveSettings;window.sendZ=sendZ;window.render=render;
window.feasInput=feasInput;window.toggleSel=toggleSel;window.saveEval=saveEval;window.loadEval=loadEval;window.delEval=delEval;window.moveToMenu=moveToMenu;
window.simCalc=simCalc;window.openDecision=openDecision;window.saveDecision=saveDecision;window.delDecision=delDecision;
window.onDocFile=onDocFile;window.docDrop=docDrop;window.docDrag=docDrag;window.delUpload=delUpload;
render();
</script>
